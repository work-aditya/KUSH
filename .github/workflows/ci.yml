name: CI - CoachKush Quality & Testing

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test-backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Tests
        run: npm test
        env:
          NODE_ENV: test
          PORT: 5001
          JWT_SECRET: test_jwt_secret_key_minimum_32_characters_long
          MONGO_URI: mongodb://localhost:27017/coachkush_test
          ADMIN_USERNAME: testadmin
          ADMIN_PASSWORD: TestAdminPassword123!
          WHATSAPP_CONTACT_URL: https://wa.me/919999999999
          PHONEPE_ENVIRONMENT: SANDBOX
          PHONEPE_MERCHANT_ID: PGTESTPAYUAT
          PHONEPE_SALT_KEY: 099eb0cd-02cf-4e2a-8aca-3e6c6aff0399
          PHONEPE_SALT_INDEX: 1

      - name: Audit Dependencies
        run: npm audit --audit-level=high || true

  test-frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build
        env:
          VITE_API_URL: https://api.yourdomain.com

version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - coachkush-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "5000"
    env_file:
      - .env
    volumes:
      - invoices_data:/app/invoices
    networks:
      - coachkush-net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ssl_certificates:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - coachkush-net

networks:
  coachkush-net:
    driver: bridge

volumes:
  ssl_certificates:
  invoices_data:

# Supabase Local Configuration for CoachKush
project_id = "coachkush"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_role = "anon"

[auth]
enabled = true
site_url = "https://coachkush.in"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "http://localhost:3000/**",
  "http://127.0.0.1:5173/**",
  "https://coachkush.in/**",
  "https://www.coachkush.in/**",
  "https://coachkush.com/**",
  "https://www.coachkush.com/**",
  "https://cochkush.in/**",
  "https://www.cochkush.in/**",
  "https://*.vercel.app/**"
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirm Your Email - CoachKush"
content_path = "./supabase/templates/confirm_signup.html"

[auth.email.template.recovery]
subject = "Reset Your Password - CoachKush"
content_path = "./supabase/templates/reset_password.html"

[auth.email.template.magic_link]
subject = "Your Login Link - CoachKush"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm Email Change - CoachKush"
content_path = "./supabase/templates/change_email.html"

[auth.email.template.reauthentication]
subject = "Your Verification Code - CoachKush"
content_path = "./supabase/templates/reauthentication.html"


[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
